name: Ticket Edge Intelligence Engine

on:
  workflow_dispatch:
  schedule:
    # Build 12 Hunter Mode: every 2 hours.
    # Frequent enough to catch newly announced/presale changes without hammering sources.
    - cron: '17 */2 * * *'

permissions:
  contents: read

concurrency:
  group: ticket-edge-intelligence
  cancel-in-progress: false

jobs:
  scan:
    name: Run Ticket Edge Hunter Mode
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Ticket Edge
        uses: actions/checkout@v4

      - name: Run Hunter Mode scanner
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python3 ticket_edge_scanner.py
