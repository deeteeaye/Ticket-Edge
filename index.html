<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#090a0d" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Ticket Edge" />
  <link rel="apple-touch-icon" sizes="180x180" href="./ticket-edge-logo.png?v=4" />
  <link rel="icon" type="image/png" href="./ticket-edge-logo.png?v=4" />
  <title>Ticket Edge</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg:#08090d; --panel:#12151b; --line:#282e3a; --text:#f5f7fb; --muted:#9da7b8;
      --green:#68e3a3; --gold:#f7c34a; --red:#ff7777;
    }
    *{box-sizing:border-box}
    body{margin:0;background:linear-gradient(180deg,#090a0d,#0d1118 60%,#08090d);color:var(--text);
      font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh}
    button,input{font:inherit} .app{max-width:980px;margin:auto;padding:14px 13px 90px}
    .top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
    .brand{display:flex;align-items:center;gap:10px} .brand img{width:48px;height:48px;border-radius:12px;object-fit:cover}
    h1{font-size:22px;margin:0} .subtitle{font-size:12px;color:var(--muted);margin-top:2px}
    .btn{border:1px solid #323947;background:#1a1f29;color:white;border-radius:11px;padding:10px 12px;cursor:pointer}
    .btn.primary{background:linear-gradient(135deg,#7a65ff,#9d6df7);border:0;font-weight:750}
    .btn.good{background:#123c29;border-color:#286746;color:#bdf6d6} .btn.ghost{background:transparent} .btn.small{padding:7px 9px;font-size:12px}
    .statusbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
    .chip{font-size:11px;padding:6px 8px;border-radius:999px;background:#171c25;border:1px solid #2b3340;color:#ccd5e4}
    .chip.live{color:#c6f9dc;border-color:#255c41;background:#102d20}
    .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px} .card{background:rgba(18,21,27,.95);border:1px solid var(--line);border-radius:16px;padding:13px}
    .metric .label{font-size:11px;color:var(--muted)} .metric .value{font-size:23px;font-weight:800;margin-top:4px} .section{margin-top:11px}
    .toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center} .search{flex:1;min-width:180px;background:#0e1117;border:1px solid #29303b;color:white;border-radius:11px;padding:10px 12px}
    .tabs{display:flex;gap:7px;overflow:auto;margin-top:10px;padding-bottom:2px} .tab{white-space:nowrap;border:1px solid #2b3240;background:#151922;color:#cbd3df;border-radius:999px;padding:8px 10px;font-size:12px}
    .tab.active{background:#252c39;color:white} .list{display:grid;gap:10px;margin-top:11px} .event{background:#11151c;border:1px solid #252c37;border-radius:16px;padding:13px}
    .eventTop{display:flex;gap:11px;align-items:flex-start;justify-content:space-between} .headline{min-width:0;flex:1} .headline h3{font-size:16px;margin:0 0 3px}
    .meta{font-size:12px;color:var(--muted)} .tags{margin-top:7px;display:flex;gap:5px;flex-wrap:wrap} .tag{font-size:10px;padding:4px 7px;border-radius:999px;background:#242b37;color:#dce5f5}
    .tag.gem{background:#362d12;color:#ffe18a;border:1px solid #69591e} .rec{min-width:86px;text-align:center;border-radius:12px;padding:9px 8px;font-weight:850;font-size:12px}
    .rec.BUY{background:#123524;color:#84efb4} .rec.REGISTER{background:#352910;color:#ffd778} .rec.WATCH{background:#2b2a18;color:#f3dd79} .rec.PASS{background:#391a1e;color:#ff9da5}
    .score{display:block;font-size:20px;margin-top:2px} .intel{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:11px}
    .intel div{background:#0d1117;border:1px solid #222936;border-radius:10px;padding:8px} .intel span{display:block;font-size:10px;color:var(--muted)} .intel b{font-size:13px}
    .why{margin-top:10px;font-size:12px;line-height:1.45;color:#d5dceb;background:#0c121a;border-left:3px solid #596a89;padding:9px 10px;border-radius:8px}
    .change{margin-top:8px;font-size:12px;line-height:1.4;background:#19141b;border:1px solid #39273c;border-radius:10px;padding:9px} .change b{color:#e9c5ff}
    .actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px} .empty{text-align:center;color:var(--muted);padding:30px 10px}
    .loginWrap{min-height:100vh;display:grid;place-items:center;padding:20px} .login{width:min(430px,100%);background:#11151c;border:1px solid #29303b;border-radius:20px;padding:20px}
    .loginLogo{display:block;width:92px;height:92px;border-radius:22px;object-fit:cover;margin:0 auto 14px} .login h2{text-align:center;margin:0 0 5px}
    .login p{text-align:center;color:var(--muted);font-size:13px;margin:0 0 16px} .login input{width:100%;background:#0d1117;border:1px solid #29313d;color:white;border-radius:11px;padding:12px;margin-bottom:9px}
    .login .btn{width:100%} .error{color:#ff9ba4;font-size:12px;margin-top:10px;text-align:center} .loading{padding:30px;text-align:center;color:var(--muted)}
    @media(max-width:720px){.grid{grid-template-columns:1fr 1fr}.intel{grid-template-columns:1fr 1fr}.top{align-items:flex-start}.brand img{width:44px;height:44px}}
  </style>
</head>
<body>
  <div id="loginScreen" class="loginWrap">
    <div class="login">
      <img src="./ticket-edge-logo.png?v=4" class="loginLogo" alt="Ticket Edge">
      <h2>Ticket Edge</h2>
      <p>Your private resale intelligence desk.</p>
      <input id="email" type="email" autocomplete="email" placeholder="Email">
      <input id="password" type="password" autocomplete="current-password" placeholder="Password">
      <button class="btn primary" onclick="signIn()">Sign in</button>
      <div id="loginError" class="error"></div>
    </div>
  </div>

  <div id="mainApp" class="app" hidden>
    <header class="top">
      <div class="brand">
        <img src="./ticket-edge-logo.png?v=4" alt="">
        <div><h1>Ticket Edge</h1><div class="subtitle">Actionable resale intelligence, not hype.</div></div>
      </div>
      <button class="btn small ghost" onclick="signOut()">Sign out</button>
    </header>

    <div class="statusbar">
      <span class="chip live">● DATABASE LIVE</span>
      <span class="chip" id="lastUpdated">Last updated: —</span>
      <span class="chip">Beta intelligence feed</span>
    </div>

    <section class="grid">
      <div class="card metric"><div class="label">BUY NOW</div><div class="value" id="mBuy">0</div></div>
      <div class="card metric"><div class="label">REGISTER</div><div class="value" id="mRegister">0</div></div>
      <div class="card metric"><div class="label">WATCH</div><div class="value" id="mWatch">0</div></div>
      <div class="card metric"><div class="label">HIDDEN GEMS</div><div class="value" id="mGem">0</div></div>
    </section>

    <section class="card section">
      <div class="toolbar">
        <input id="search" class="search" placeholder="Search artist, city, venue…" oninput="render()">
        <button class="btn primary" onclick="loadAll()">↻ Refresh Intel</button>
      </div>
      <div class="tabs">
        <button class="tab active" onclick="setFilter('ALL',this)">All Active</button>
        <button class="tab" onclick="setFilter('BUY',this)">🔥 Buy</button>
        <button class="tab" onclick="setFilter('REGISTER',this)">📝 Register</button>
        <button class="tab" onclick="setFilter('WATCH',this)">👀 Watch</button>
        <button class="tab" onclick="setFilter('PASS',this)">Pass</button>
      </div>
      <div id="eventList" class="list"><div class="loading">Loading Ticket Edge intelligence…</div></div>
    </section>
  </div>

<script>
const SUPABASE_URL = 'https://stbvvdcehpmubralmfvt.supabase.co';
const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_FmOFrr76xUZ7snH4zs9bQw_O9OyfBr0';
const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);

let opportunities = [], changes = [], presales = [], activeFilter = 'ALL';
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const money = n => n == null ? '—' : new Intl.NumberFormat('en-US',{style:'currency',currency:'USD',maximumFractionDigits:0}).format(Number(n));
const fmtDate = s => s ? new Date(s).toLocaleString([],{month:'short',day:'numeric',year:'numeric',hour:'numeric',minute:'2-digit'}) : '—';

async function signIn(){
  $('loginError').textContent = '';
  const { error } = await db.auth.signInWithPassword({email:$('email').value.trim(), password:$('password').value});
  if(error) $('loginError').textContent = error.message;
}
async function signOut(){ await db.auth.signOut(); }
async function applySession(session){
  const signedIn = !!session;
  $('loginScreen').hidden = signedIn;
  $('mainApp').hidden = !signedIn;
  if(signedIn) await loadAll();
}
db.auth.onAuthStateChange((_event, session) => applySession(session));
db.auth.getSession().then(({data})=>applySession(data.session));

async function loadAll(){
  $('eventList').innerHTML = '<div class="loading">Refreshing live database…</div>';
  const [oRes,cRes,pRes] = await Promise.all([
    db.from('opportunities').select('*').in('status',['active','bought']).order('score',{ascending:false}),
    db.from('opportunity_changes').select('*').order('changed_at',{ascending:false}),
    db.from('presales').select('*').order('presale_start',{ascending:true})
  ]);
  const errors=[oRes.error,cRes.error,pRes.error].filter(Boolean);
  if(errors.length){
    $('eventList').innerHTML=`<div class="empty"><b>Database connection blocked.</b><br><br>${esc(errors[0].message)}<br><br>Run the Ticket Edge beta access SQL in Supabase, then tap Refresh Intel.</div>`;
    return;
  }
  opportunities=oRes.data||[]; changes=cRes.data||[]; presales=pRes.data||[];
  const latest=opportunities.map(x=>x.last_scanned_at).filter(Boolean).sort().pop();
  $('lastUpdated').textContent='Last updated: '+(latest?fmtDate(latest):'—');
  render();
}
function setFilter(value,el){activeFilter=value;document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));el.classList.add('active');render();}
function latestChange(id){return changes.find(c=>c.opportunity_id===id);}
function nextPresale(id){
  const now=Date.now();
  return presales.filter(p=>p.opportunity_id===id&&p.presale_start&&new Date(p.presale_start).getTime()>=now)
    .sort((a,b)=>new Date(a.presale_start)-new Date(b.presale_start))[0];
}
function render(){
  const q=$('search').value.trim().toLowerCase();
  $('mBuy').textContent=opportunities.filter(x=>x.recommendation==='BUY').length;
  $('mRegister').textContent=opportunities.filter(x=>x.recommendation==='REGISTER').length;
  $('mWatch').textContent=opportunities.filter(x=>x.recommendation==='WATCH').length;
  $('mGem').textContent=opportunities.filter(x=>x.hidden_gem).length;

  const rows=opportunities.filter(o=>{
    if(activeFilter!=='ALL'&&o.recommendation!==activeFilter)return false;
    if(!q)return true;
    return [o.artist,o.event_name,o.city,o.state,o.venue,o.broker_thesis,o.recommendation_reason].join(' ').toLowerCase().includes(q);
  });
  if(!rows.length){$('eventList').innerHTML='<div class="empty">No opportunities match this view.</div>';return;}

  $('eventList').innerHTML=rows.map(o=>{
    const c=latestChange(o.id), p=nextPresale(o.id);
    const title=o.event_name?`${o.artist} — ${o.event_name}`:o.artist;
    const trend=c&&c.previous_score!=null&&c.new_score!=null?c.new_score-c.previous_score:null;
    const trendText=trend==null?'':trend>0?` ↑${trend}`:trend<0?` ↓${Math.abs(trend)}`:'';
    const resale=(o.expected_resale_low!=null||o.expected_resale_high!=null)?`${money(o.expected_resale_low)}–${money(o.expected_resale_high)}`:'—';
    return `<article class="event">
      <div class="eventTop">
        <div class="headline">
          <h3>${esc(title)}</h3>
          <div class="meta">${esc(o.city||'')}${o.state?', '+esc(o.state):''}${o.venue?' • '+esc(o.venue):''}${o.event_date?' • '+fmtDate(o.event_date):''}</div>
          <div class="tags"><span class="tag">${esc(o.category||'event')}</span><span class="tag">Confidence: ${esc(o.confidence||'—')}</span>${o.hidden_gem?'<span class="tag gem">💎 HIDDEN GEM</span>':''}</div>
        </div>
        <div class="rec ${esc(o.recommendation)}">${esc(o.recommendation)}<span class="score">${o.score??'—'}${trendText}</span></div>
      </div>
      <div class="intel">
        <div><span>MAX BUY / TICKET</span><b>${o.max_price_per_ticket!=null?money(o.max_price_per_ticket):'TBD'}</b></div>
        <div><span>QUANTITY</span><b>${o.recommended_quantity??'—'}</b></div>
        <div><span>EXPECTED RESALE</span><b>${resale}</b></div>
        <div><span>CAPITAL EFFICIENCY</span><b>${o.capital_efficiency_score??'—'}/100</b></div>
      </div>
      <div class="why"><b>Broker thesis:</b> ${esc(o.broker_thesis||o.recommendation_reason||'Awaiting deeper analysis.')}</div>
      ${c?`<div class="change"><b>WHAT CHANGED:</b> ${esc(c.change_summary||'')}<br><span style="color:#aeb8c8">${esc(c.change_reason||'')}</span></div>`:''}
      ${p?`<div class="change"><b>NEXT ACCESS:</b> ${esc(p.provider||p.presale_type)} • ${fmtDate(p.presale_start)}${p.registration_deadline?`<br>Registration deadline: ${fmtDate(p.registration_deadline)}`:''}</div>`:''}
      <div class="actions">${o.ticket_url?`<button class="btn good small" onclick="window.open('${esc(o.ticket_url)}','_blank')">Open Tickets</button>`:''}</div>
    </article>`;
  }).join('');
}
</script>
</body>
</html>
